# Tagging a commit with [circle front] will build the front page and perform test-doc.
# Tagging a commit with [circle full] will build everything.
version: 2
jobs:
  build_docs:
    docker:
      - image: cimg/python:3.9.11-browsers
    steps:
      - checkout
      - run:
          name: Set BASH_ENV
          command: |
            echo "set -e" >> $BASH_ENV
            echo "export DISPLAY=:99" >> $BASH_ENV
            echo "export OPENBLAS_NUM_THREADS=4" >> $BASH_ENV
            echo "export CONDA_NO_PLUGINS=true" >> $BASH_ENV
            echo "BASH_ENV:"
            cat $BASH_ENV

      - run:
          name: Merge with upstream
          command: |
            echo $(git log -1 --pretty=%B) | tee gitlog.txt
            echo ${CI_PULL_REQUEST//*pull\//} | tee merge.txt
            if [[ $(cat merge.txt) != "" ]]; then
              echo "Merging $(cat merge.txt)";
              git remote add upstream https://github.com/peerannot/peerannot.git;
              git pull --ff-only upstream "refs/pull/$(cat merge.txt)/merge";
              git fetch upstream main;
            fi

      # Load our data. Cache only raw package tarballs + pip cache, never the
      # live ~/miniconda tree — reinstalling on top of a restored miniconda
      # directory is what caused a broken pydantic_core/conda_lockfiles
      # plugin state previously. Key is versioned so we can bust it on demand.
      - restore_cache:
          keys:
            - pkgs-cache-v2

      - run:
          name: Spin up Xvfb
          command: |
            /sbin/start-stop-daemon --start --quiet --pidfile /tmp/custom_xvfb_99.pid --make-pidfile --background --exec /usr/bin/Xvfb -- :99 -screen 0 1400x900x24 -ac +extension GLX +render -noreset;

      - run:
          name: Get conda running
          command: |
            set -x  # Enable debug mode

            # Pin the Miniforge version instead of "latest" so a new upstream
            # release can't silently change conda's plugin set (e.g.
            # conda_lockfiles + pydantic) or Python version out from under us.
            MINIFORGE_VERSION=24.11.3-2

            wget -q "https://github.com/conda-forge/miniforge/releases/download/${MINIFORGE_VERSION}/Miniforge3-${MINIFORGE_VERSION}-$(uname)-$(uname -m).sh" -O ~/miniconda.sh
            chmod +x ~/miniconda.sh

            # Always install into a clean, non-existent path. Do NOT use -u
            # (update-in-place) here — that overlays the installer onto
            # whatever was restored from cache and left pydantic_core's
            # compiled extension in a broken, mismatched state last time.
            rm -rf ~/miniconda
            ~/miniconda.sh -b -p ~/miniconda || { echo "Conda installation failed"; exit 1; }

            # Update PATH and source
            echo "export PATH=~/miniconda/bin:$PATH" >> $BASH_ENV
            source $BASH_ENV

            # Reuse previously-downloaded package tarballs (if any) by
            # dropping them into the fresh install's pkg cache, rather than
            # caching/restoring the live miniconda tree itself.
            mkdir -p ~/conda_pkgs
            cp -rn ~/conda_pkgs/* ~/miniconda/pkgs/ 2>/dev/null || echo "No cached packages to reuse"

            # Initialize conda
            source ~/.bashrc

            # Verify conda
            conda --version || { echo "Conda not found"; exit 1; }

      - run:
          name: Get Python running
          command: |
            source ~/miniconda/etc/profile.d/conda.sh
            # remove the cache index
            mamba clean -i -y
            mamba install python=3.10 numpy pip -yq
            mamba install pandoc -yq
            pip install --upgrade "setuptools"
            pip install --upgrade --progress-bar off -e .
            pip install --upgrade --progress-bar off -e .[doc]

      - run:
          name: Snapshot conda packages for cache
          command: |
            # Copy the (now populated) package tarballs back out so
            # save_cache stores just the downloads, not the live env.
            mkdir -p ~/conda_pkgs
            cp -rn ~/miniconda/pkgs/*.conda ~/miniconda/pkgs/*.tar.bz2 ~/conda_pkgs/ 2>/dev/null || true

      - save_cache:
          key: pkgs-cache-v2
          paths:
            - ~/.cache/pip
            - ~/conda_pkgs

      # Look at what we have and fail early if there is some library conflict
      - run:
          name: Check installation
          command: |
            which python
            python -c "import peerannot"

      # Build docs
      - run:
          name: make html
          command: |
            cd doc;
            make html;

      # Save the outputs
      - store_artifacts:
          path: doc/_build/html/
          destination: dev
      - persist_to_workspace:
          root: doc/_build
          paths:
            - html
  deploy:
    docker:
      - image: cimg/python:3.9.11-browsers
    steps:
      - attach_workspace:
          at: /tmp/build
      - run:
          name: Fetch docs
          command: |
            set -e
            mkdir -p ~/.ssh
            echo -e "Host *\nStrictHostKeyChecking no" > ~/.ssh/config
            chmod og= ~/.ssh/config
            if [ ! -d ~/peerannot.github.io ]; then
              git clone git@github.com:/peerannot/peerannot.github.io.git ~/peerannot.github.io --depth=1
            fi
      - run:
          name: Deploy docs
          command: |
            set -e;
            cd ~/peerannot.github.io;
            if [[ "${CIRCLE_BRANCH}" != "main" ]]; then
              echo "No deployment (build: ${CIRCLE_BRANCH}).";
            else
              git config --global user.email "tanguy_l@outlook.fr";
              git config --global user.name "Circle CI";
              cd ~/peerannot.github.io;
              git checkout main
              git remote -v
              git fetch origin
              git reset --hard origin/main
              mv .git ..
              mv .gitignore ..
              rm -rf *
              mv ../.git .
              mv ../.gitignore .
              echo "Deploying dev docs for ${CIRCLE_BRANCH}.";
              cp -a /tmp/build/html/* .;
              if [[ -z $(git diff) ]]; then
                echo "Nothing to commit"
              else
                touch .nojekyll;
                git add -A;
                git commit -m "CircleCI update of dev docs (${CIRCLE_BUILD_NUM}).";
                git push origin main;
              fi
            fi

workflows:
  version: 2

  default:
    jobs:
      - build_docs
      - deploy:
          requires:
            - build_docs
          filters:
            branches:
              only:
                - main