[metadata]
classifiers =
    Development Status :: 4 - Beta
    Environment :: Console
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    License :: OSI Approved :: BSD License
    Operating System :: OS Independent
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering
    Topic :: Utilities
    Topic :: Software Development :: Libraries
description = Crowdsourcing library
download_url = https://github.com/peerannot/peerannot.git
long_description = file: README.rst
license = BSD (3-clause)
maintainer = Tanguy Lefort
maintainer_email = tanguy.lefort@seenovate.com
name = peerannot
platforms = any
version = file: VERSION.txt

[options]
include_package_data = True
python_requires = >=3.8,<3.14
packages = find:
install_requires =
    numpy>=1.22.1
    scipy>=1.7.3
    pandas>=1.5.2
    click>=8.0.0
    torch
    torchvision
    torchmetrics
    scikit-learn>=1.2.1
    plotly>=5.10.0
    tqdm>=4.64.0
    cffi>=1.17.1
    pydantic>=2.10.6
    sparse==0.15.5
    Pillow~=11.1.0
    line_profiler
    loguru

project_urls =
    Documentation = https://peerannot.github.io/
    Source = https://github.com/peerannot/peerannot
    Tracker = https://github.com/peerannot/peerannot/issues

[options.extras_require]
test =
    pytest
    pytest-cov
    pytest-timeout
    coverage

doc =
    sphinx
    numpydoc
    sphinx-click
    sphinx-nefertiti
    sphinx-copybutton
    sphinx-prompt
    sphinx-gallery
    sphinx-design
    sphinx-book-theme
    nbsphinx
    notebook
    ipython
    matplotlib